name: SafeStripe checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: safestripe
          POSTGRES_PASSWORD: safestripe
          POSTGRES_DB: safestripe_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U safestripe"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run release:check
        env:
          PACKAGE_DATABASE_URL: postgresql://safestripe:safestripe@localhost:5432/safestripe_test
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://safestripe:safestripe@localhost:5432/safestripe_test
      - run: npm audit --omit=dev --audit-level=high
