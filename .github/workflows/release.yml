name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag (for example v0.3.0)
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    environment: npm-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read
      security-events: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a verified annotated tag on main
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq 'select(.object.type == "tag") | .object.sha')
          test -n "$SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$SHA" --jq '.verification.verified')" = true
          git checkout --detach "$TAG"
          git merge-base --is-ancestor HEAD origin/main
      - name: Require CI, security and account-verified Stripe evidence on the tag commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-evidence.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.15.0
      - run: npm ci --ignore-scripts
      - run: npm run release:check && npm run test:chaos
      - name: Verify identity and build release evidence
        env:
          TAG: ${{ inputs.tag }}
        run: |
          node -e 'const p=require("./package.json"); if(p.name!=="safestripe" || "v"+p.version!==process.env.TAG) process.exit(1)'
          node scripts/check-secrets.mjs --all
          npm audit --omit=dev --audit-level=high
          mkdir release-artifacts
          npm pack --pack-destination release-artifacts
          npm sbom --sbom-format=cyclonedx --omit=dev > release-artifacts/sbom.cdx.json
          cd release-artifacts
          sha256sum *.tgz sbom.cdx.json > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence
          path: release-artifacts
      - name: Publish through npm trusted publishing
        run: npm publish release-artifacts/*.tgz --access public --provenance
      - name: Attach release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "$TAG" || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" release-artifacts/*
