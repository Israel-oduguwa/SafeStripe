name: Dedicated Stripe sandbox
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service-tests:
    environment: stripe-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:stripe:e2e
        env:
          STRIPE_E2E_CONFIRM: disposable-sandbox
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_RESTRICTED_KEY }}
          STRIPE_ACCOUNT_ID: ${{ vars.STRIPE_SANDBOX_ACCOUNT_ID }}
      - name: Require the account-verified release evidence
        run: node -e 'const r=require("./artifacts/stripe-e2e.json"); if(!r.passed || !r.accountIdentityVerified || r.sourceDirty) process.exit(1)'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stripe-sandbox-report
          path: artifacts/stripe-e2e.json
          if-no-files-found: warn
