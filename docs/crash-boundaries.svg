<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 440" role="img" aria-labelledby="title"><title id="title">Process crash checkpoints and expected recovery</title><rect width="950" height="440" rx="16" fill="#f7f9f6"/><g font-family="system-ui,sans-serif" fill="#203a2a"><text x="30" y="37" font-size="21">Process disappears here</text><text x="440" y="37" font-size="21">Recovery decision</text><rect x="24" y="65" width="900" height="58" rx="8" fill="white" stroke="#ccd8ce"/><text x="42" y="100" font-size="16">1. Before admission commit</text><text x="440" y="100" font-size="16">Return failure; provider retries</text><rect x="24" y="137" width="900" height="58" rx="8" fill="white" stroke="#ccd8ce"/><text x="42" y="172" font-size="16">2. After admission commit</text><text x="440" y="172" font-size="16">Duplicate delivery finds saved job</text><rect x="24" y="209" width="900" height="58" rx="8" fill="white" stroke="#ccd8ce"/><text x="42" y="244" font-size="16">3. After claim / during transaction</text><text x="440" y="244" font-size="16">Lease expires; uncommitted work rolls back</text><rect x="24" y="281" width="900" height="58" rx="8" fill="white" stroke="#ccd8ce"/><text x="42" y="316" font-size="16">4. After state + outbox commit</text><text x="440" y="316" font-size="16">Effect guard preserves the committed outcome</text><rect x="24" y="353" width="900" height="58" rx="8" fill="white" stroke="#ccd8ce"/><text x="42" y="388" font-size="16">5. After downstream acceptance</text><text x="440" y="388" font-size="16">Repeat delivery key; recipient deduplicates</text></g></svg>