<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">SafeStripe reliability boundaries</title><desc id="desc">An application persists operation identity before Stripe. Signed events enter a durable inbox. A leased worker commits state, effect guard and outbox together. Delivery to a recipient is at least once.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#426550"/></marker></defs><rect width="1000" height="500" rx="16" fill="#f7f9f6"/><g fill="#fff" stroke="#b9c9bd" stroke-width="2"><rect x="30" y="45" width="220" height="90" rx="10"/><rect x="325" y="45" width="270" height="90" rx="10"/><rect x="740" y="45" width="230" height="90" rx="10"/><rect x="740" y="210" width="230" height="90" rx="10"/><rect x="400" y="210" width="260" height="90" rx="10"/><rect x="30" y="210" width="280" height="110" rx="10"/><rect x="30" y="390" width="280" height="70" rx="10"/></g><g fill="#203a2a" font-family="system-ui,sans-serif" font-size="18" text-anchor="middle"><text x="140" y="82">Application</text><text x="140" y="111" font-size="14">Authenticated intent</text><text x="460" y="82">Durable operation record</text><text x="460" y="111" font-size="14">Scope + ID + fingerprint</text><text x="855" y="82">Stripe API</text><text x="855" y="111" font-size="14">Stable idempotency key</text><text x="855" y="247">Verify + admit webhook</text><text x="855" y="276" font-size="14">Acknowledge after commit</text><text x="530" y="247">Durable inbox + worker</text><text x="530" y="276" font-size="14">Lease + ownership token</text><text x="170" y="245">One database transaction</text><text x="170" y="276" font-size="14">Billing state + effect guard</text><text x="170" y="300" font-size="14">+ outbox intent</text><text x="170" y="422">Downstream recipient</text><text x="170" y="445" font-size="14">Deduplicates delivery key</text></g><g fill="none" stroke="#426550" stroke-width="2" marker-end="url(#arrow)"><path d="M250 90H325"/><path d="M595 90H740"/><path d="M855 135V210"/><path d="M740 255H660"/><path d="M400 255H310"/><path d="M170 320V390"/></g><text x="193" y="357" font-family="system-ui,sans-serif" font-size="14" fill="#426550">At-least-once dispatch</text><text x="465" y="405" font-family="system-ui,sans-serif" font-size="16" fill="#426550">No transaction spans Stripe and your database.</text><text x="465" y="435" font-family="system-ui,sans-serif" font-size="14" fill="#426550">Recovery preserves identity and makes uncertainty explicit.</text></svg>